<!DOCTYPE html>
<html lang="en">
<head>

\___ \| | | | |_) |  _| | |_) | | |  | | | | | | | |

  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COLE IS COOL</title>
  <meta name="description" content="An official statement confirming that Cole is, in fact, cool." />
  <style>
    :root {
      --sky: #1e90ff;
      --deep-blue: #0a4bd1;
      --ink: #04204d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, var(--sky), var(--deep-blue));
      color: #fff;
      font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6vmin;
      gap: 5vmin;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(3rem, 15vw, 12rem);
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      /* Outline drawn with layered shadows (renders reliably on mobile), plus depth */
      text-shadow:
        2px 2px 0 var(--ink), -2px 2px 0 var(--ink),
        2px -2px 0 var(--ink), -2px -2px 0 var(--ink),
        2px 0 0 var(--ink), -2px 0 0 var(--ink),
        0 2px 0 var(--ink), 0 -2px 0 var(--ink),
        0 10px 22px rgba(0, 0, 0, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    h1 .shades {
      display: inline-block;
      text-shadow: none;
      animation: tilt 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    @keyframes tilt {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }

    .cool-link {
      font-size: clamp(1rem, 3.4vw, 1.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cool-link a {
      color: #fff;
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.18em;
      transition: color 0.15s ease, transform 0.15s ease;
      display: inline-block;
    }

    .cool-link a:hover,
    .cool-link a:focus-visible {
      color: var(--ink);
      transform: scale(1.06);
    }

  </style>
</head>
<body>
  <h1>Cole Is<br />Cool <span class="shades" aria-hidden="true">😎</span></h1>

  <p class="cool-link"><a href="https://ericisnot.cool">You know who is not cool?</a></p>
</body>
</html>
